
name: Build Fabric Mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Find project
        id: project
        shell: bash
        run: |
          G="$(find . -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path './.git/*' -print -quit)"

          if [ -z "$G" ]; then
            echo "::error::build.gradle not found"
            find . -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          D="$(dirname "$G")"
          echo "Project directory: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - name: Build mod
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: arrowmod-fabric-1.19.4
          path: |
            ${{ steps.project.outputs.dir }}/build/libs/*.jar
            !${{ steps.project.outputs.dir }}/build/libs/*-sources.jar
          if-no-files-found: error
